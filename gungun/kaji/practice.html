<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>会話練習</title>

  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f5f5f5;
    }

    h1 {
      text-align: center;
      font-size: 1.6rem;
      margin-bottom: 30px;
    }

    .practice-card {
      display: flex;
      align-items: center;
      justify-content: space-between;

      max-width: 600px;
      margin: 0 auto 20px auto;
      padding: 20px;

      background-color: white;
      border-radius: 16px;

      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .illustration {
      width: 45%;
      max-width: 220px;
      height: auto;
      object-fit: contain;
    }

    .play-area {
      width: 45%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .play-button {
      width: 100px;
      height: 100px;

      border: none;
      border-radius: 50%;

      background-color: #333;
      color: white;

      font-size: 3rem;

      cursor: pointer;
    }

    .play-button:active {
      transform: scale(0.95);
    }

    @media (max-width: 500px) {

      body {
        padding: 12px;
      }

      .practice-card {
        padding: 16px;
      }

      .play-button {
        width: 85px;
        height: 85px;
        font-size: 2.5rem;
      }

    }
  </style>
</head>

<body>

  <h1>会話練習</h1>


  <!-- 場面1 -->
  <div class="practice-card">

    <img
      src="images/scene1.png"
      alt="場面1"
      class="illustration"
    >

    <div class="play-area">
      <button
        class="play-button"
        onclick="playAudio('audio/scene1.mp3')"
      >
        ▶
      </button>
    </div>

  </div>


  <!-- 場面2 -->
  <div class="practice-card">

    <img
      src="images/scene2.png"
      alt="場面2"
      class="illustration"
    >

    <div class="play-area">
      <button
        class="play-button"
        onclick="playAudio('audio/scene2.mp3')"
      >
        ▶
      </button>
    </div>

  </div>


  <!-- 場面3 -->
  <div class="practice-card">

    <img
      src="images/scene3.png"
      alt="場面3"
      class="illustration"
    >

    <div class="play-area">
      <button
        class="play-button"
        onclick="playAudio('audio/scene3.mp3')"
      >
        ▶
      </button>
    </div>

  </div>


  <!-- 場面4 -->
  <div class="practice-card">

    <img
      src="images/scene4.png"
      alt="場面4"
      class="illustration"
    >

    <div class="play-area">
      <button
        class="play-button"
        onclick="playAudio('audio/scene4.mp3')"
      >
        ▶
      </button>
    </div>

  </div>


  <script>

    let currentAudio = null;

    function playAudio(file) {

      // ほかの音声が再生中なら停止
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }

      // 新しい音声を作成
      currentAudio = new Audio(file);

      // 再生
      currentAudio.play();

    }

  </script>

</body>
</html>
