<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>会話練習</title>

  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f5f5f5;
    }

    h1 {
      text-align: center;
      font-size: 1.6rem;
      margin-bottom: 30px;
    }

    .practice-card {
      display: flex;
      align-items: center;
      justify-content: space-between;

      max-width: 700px;
      margin: 0 auto 20px auto;
      padding: 20px;

      background-color: white;
      border-radius: 16px;

      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .illustration {
      width: 40%;
      max-width: 240px;
      height: auto;
      object-fit: contain;
    }

    .audio-area {
      width: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .audio-player {
      width: 100%;
      max-width: 320px;
    }

    /* スマホ表示 */
    @media (max-width: 600px) {

      body {
        padding: 12px;
      }

      h1 {
        font-size: 1.4rem;
        margin-bottom: 20px;
      }

      .practice-card {
        flex-direction: column;
        justify-content: center;
        gap: 18px;

        padding: 18px;
        margin-bottom: 18px;
      }

      .illustration {
        width: 80%;
        max-width: 280px;
      }

      .audio-area {
        width: 100%;
      }

      .audio-player {
        width: 100%;
        max-width: none;
      }
    }
  </style>
</head>

<body>

  <h1>会話練習</h1>

  <!-- 場面1 -->
  <div class="practice-card">

    <img
      src="kaji1.png"
      alt="場面1"
      class="illustration"
    >

    <div class="audio-area">
      <audio controls class="audio-player">
        <source src="audio/scene1.mp3" type="audio/mpeg">
        このブラウザでは音声を再生できません。
      </audio>
    </div>

  </div>


  <!-- 場面2 -->
  <div class="practice-card">

    <img
      src="kaji2.png"
      alt="場面2"
      class="illustration"
    >

    <div class="audio-area">
      <audio controls class="audio-player">
        <source src="audio/scene2.mp3" type="audio/mpeg">
        このブラウザでは音声を再生できません。
      </audio>
    </div>

  </div>


  <!-- 場面3 -->
  <div class="practice-card">

    <img
      src="kaji3.png"
      alt="場面3"
      class="illustration"
    >

    <div class="audio-area">
      <audio controls class="audio-player">
        <source src="audio/scene3.mp3" type="audio/mpeg">
        このブラウザでは音声を再生できません。
      </audio>
    </div>

  </div>


  <!-- 場面4 -->
  <div class="practice-card">

    <img
      src="kaji4.png"
      alt="場面4"
      class="illustration"
    >

    <div class="audio-area">
      <audio controls class="audio-player">
        <source src="audio/scene4.mp3" type="audio/mpeg">
        このブラウザでは音声を再生できません。
      </audio>
    </div>

  </div>


  <script>
    const audioPlayers = document.querySelectorAll('audio');

    audioPlayers.forEach(player => {
      player.addEventListener('play', () => {

        audioPlayers.forEach(otherPlayer => {
          if (otherPlayer !== player) {
            otherPlayer.pause();
            otherPlayer.currentTime = 0;
          }
        });

      });
    });
  </script>

</body>
</html>
