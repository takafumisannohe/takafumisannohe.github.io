<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>わくわくクラス 第10課 災害に備える - 聞く練習</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f7f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    }

    .container {
      width: min(90%, 420px);
      text-align: center;
    }

    #playButton {
      width: 100%;
      min-height: 160px;
      border: none;
      border-radius: 24px;
      background: #1976d2;
      color: white;
      font-size: 4rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
      transition: transform 0.08s ease, opacity 0.08s ease;
      touch-action: manipulation;
    }

    #playButton:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    #playButton:disabled {
      opacity: 0.55;
      cursor: default;
    }

    #replayButton {
      width: 100%;
      min-height: 72px;
      margin-top: 16px;
      border: 2px solid #1976d2;
      border-radius: 18px;
      background: white;
      color: #1976d2;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.08s ease, opacity 0.08s ease;
      touch-action: manipulation;
    }

    #replayButton:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    #replayButton:disabled {
      opacity: 0.4;
      cursor: default;
    }

    #status {
      min-height: 1.5em;
      margin-top: 24px;
      color: #555;
      font-size: 1rem;
    }
  </style>
</head>

<body>

  <main class="container">

　　<button id="playButton" type="button" aria-label="音声を再生">
    ▶
　　</button>

    <button id="replayButton" type="button" disabled>
      🔁 もういちど
    </button>

    <p id="status" aria-live="polite">ボタンを　おしてください</p>
  </main>

  <audio id="audioPlayer" preload="auto"></audio>

  <script>
    /*
      ここに音声ファイル名を入れてください。
      index.html と同じフォルダに音声ファイルがある場合の例です。
    */
    const audioFiles = [
      "10_3.mp3",
      "10_4.mp3",
      "10_5.mp3",
      "10_6.mp3",
      "10_7.mp3",
      "10_8.mp3",
      "10_9.mp3",
      "10_10.mp3",
      "10_21.m4a"
    ];

    const playButton = document.getElementById("playButton");
    const replayButton = document.getElementById("replayButton");
    const audioPlayer = document.getElementById("audioPlayer");
    const status = document.getElementById("status");

    let previousIndex = -1;
    let currentAudioFile = null;

    function getRandomIndex() {
      if (audioFiles.length === 1) {
        return 0;
      }

      let index;
      do {
        index = Math.floor(Math.random() * audioFiles.length);
      } while (index === previousIndex);

      return index;
    }

    async function playAudio(file) {
      audioPlayer.pause();
      audioPlayer.currentTime = 0;
      audioPlayer.src = file;

      try {
        await audioPlayer.play();
        return true;
      } catch (error) {
        console.error(error);
        status.textContent = "音声を再生できませんでした。";
        return false;
      }
    }

    playButton.addEventListener("click", async () => {
      if (audioFiles.length === 0) {
        status.textContent = "音声が登録されていません。";
        return;
      }

      const index = getRandomIndex();
      previousIndex = index;
      currentAudioFile = audioFiles[index];

      playButton.disabled = true;
      replayButton.disabled = true;
      status.textContent = "再生中…";

      const success = await playAudio(currentAudioFile);

      if (success) {
        replayButton.disabled = false;
      } else {
        playButton.disabled = false;
      }
    });

    replayButton.addEventListener("click", async () => {
      if (!currentAudioFile) {
        return;
      }

      playButton.disabled = true;
      replayButton.disabled = true;
      status.textContent = "もう一度再生中…";

      const success = await playAudio(currentAudioFile);

      if (success) {
        replayButton.disabled = false;
      }
      playButton.disabled = false;
    });

    audioPlayer.addEventListener("ended", () => {
      playButton.disabled = false;
      if (currentAudioFile) {
        replayButton.disabled = false;
      }
      status.textContent = "▶ を　おしてください";
    });

    audioPlayer.addEventListener("error", () => {
      playButton.disabled = false;
      if (currentAudioFile) {
        replayButton.disabled = false;
      }
      status.textContent = "音声ファイルが見つかりません。";
    });
  </script>

</body>
</html>
